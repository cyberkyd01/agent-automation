<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Automation</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <select id="provider" aria-label="Provider"></select>
      <select id="model" aria-label="Model"></select>
      <input id="modelCustom" type="text" placeholder="Model ID, then Enter" aria-label="Custom model ID" spellcheck="false" autocomplete="off" hidden>
      <button id="reloadModels" class="icon" type="button" title="Reload models" aria-label="Reload models">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="newChat" class="icon" type="button" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg>
      </button>
      <button id="openSettings" class="icon" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </button>
    </header>

    <div id="status" role="status" title="Click to dismiss" hidden></div>

    <main id="chat" aria-label="Conversation"></main>

    <footer id="composer">
      <div id="attachments" class="thumbs attachments" aria-label="Attached images" hidden></div>
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Ask anything, or tell me what to do on this page…" aria-label="Message"></textarea>
        <div class="composer-row">
          <select id="approval" aria-label="Approval mode" title="Approval mode">
            <option value="ask">Ask before acting</option>
            <option value="auto">Act without asking</option>
          </select>
          <button id="attach" class="icon" type="button" title="Attach images" aria-label="Attach images">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <input id="fileInput" type="file" accept="image/*" multiple hidden>
          <div id="tab" class="tab"><img id="tabIcon" alt="" hidden><span id="tabTitle"></span></div>
          <button id="send" class="btn primary" type="button" title="Send (Enter)">Send</button>
        </div>
      </div>
    </footer>
  </div>

  <section id="settings" aria-label="Settings" hidden>
    <div class="settings-head">
      <button id="closeSettings" class="icon" type="button" title="Back" aria-label="Back to chat">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>Settings</h2>
    </div>
    <div id="settingsBody"></div>
  </section>
</body>
</html>
